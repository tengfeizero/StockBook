name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 issue，并确认用的是最新版本。
        安全漏洞请勿在此提交，见 [SECURITY.md](../blob/main/SECURITY.md)。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 用五金店演示数据登录
        2. 新建销售出库，选择批次商品
        3. 确认生效后库存显示为 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 页面右下角或 release 文件名，如 v0.24
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Windows 单文件（双击运行）
        - Windows 服务（huoben.exe -install）
        - Linux + systemd
        - Docker
        - 源码开发模式（go run + npm run dev）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、浏览器及版本、是否经 Caddy/Nginx 反代
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: data/logs/ 下的日志片段、浏览器控制台报错、接口返回
      render: shell
